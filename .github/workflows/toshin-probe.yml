name: 東進の天気の作りを調べる

on:
  push:
    branches: [probe-toshin]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 下調べ
        run: python3 scripts/probe_toshin.py
