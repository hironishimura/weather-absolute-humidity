name: 取得先を調べる

on:
  push:
    branches: [probe-toshin]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 地名から緯度経度を引けるか
        run: python3 scripts/probe_geocode.py
      - name: 詰めの確認
        run: python3 scripts/probe_geocode2.py
