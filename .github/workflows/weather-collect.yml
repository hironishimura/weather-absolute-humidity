name: 気象データの取り込み

# 【何をするか】
# Yahoo!天気とウェザーニュースは公開APIがなく、ブラウザから直接は読めません。
# ここでページを取得して docs/data/latest.json に書き出し、
# アプリがそれを読む、という流れです。
#
# 気象庁の実況と予報はアプリが直接読むので、この取り込みが動いていなくても
# アプリ自体は問題なく使えます。
#
# 【地点を変えるとき】
#   scripts/settings.json の url を自分の地域のページのURLに直してください。
#   読めなくなったら scripts/probe.py（ページの作りを調べる）が役に立ちます。


on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: '書き出さずに中身だけ確認する'
        type: boolean
        default: false
  schedule:
    - cron: '5 */3 * * *'   # 3時間おき（Yahoo!天気の表が3時間刻みなのに合わせています）
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/weather-collect.yml'

concurrency:
  group: weather-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # latest.json を書き戻すため

    steps:
      - uses: actions/checkout@v4

      - name: 読み取り処理を確かめる
        run: python3 scripts/test_collect.py

      - name: 取り込む
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            python3 scripts/collect.py --dry-run
          else
            python3 scripts/collect.py
          fi

      - name: ブラウザで取り込む（任意）
        # ページを開いてから画面側で組み立てられる値（ウェザーニュースの1時間ごと予報など）
        # を取りにいきます。読めたぶんだけ足す作りなので、失敗しても上の結果は残ります。
        # 不要なら scripts/settings.json の browser.enabled を false にするか、
        # このステップごと消してください。
        if: inputs.dry-run != true
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 scripts/collect_browser.py

      - name: 降水確率の当たり具合を数える
        # いまの予報を history.json に書きため、終わった期間について
        # アメダスの実際の降水量とつき合わせます。
        # 過去の予報はあとから取り寄せられないので、
        # ここが動きはじめてから1週間ほどで数字がそろいます。
        if: inputs.dry-run != true
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/verify.py

      - name: 変わっていれば記録する
        if: inputs.dry-run != true
        run: |
          FILES="docs/data/latest.json docs/data/history.json docs/data/accuracy.json"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "内容に変化がないためコミットしません。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "更新: 気温・湿度の取り込みデータ"
          git pull --rebase --autostash
          git push

      - name: Xserver へ送る
        # 【なぜ必要か】
        # アプリは data/latest.json を相対パスで読みます。
        # GitHub Pages ではリポジトリの中身がそのまま配信されるので、上の
        # コミットだけで公開側も新しくなりました。Xserver VPS では配信元が
        # 別なので、同じ3つをサーバーにも置かないと表示が止まります。
        # 気象庁・MSM/GSM・ECMWF はアプリが直接読むため影響を受けませんが、
        # Yahoo!天気・ウェザーニュース・降水確率の当たり具合は止まります。
        #
        # 【毎回送る理由】
        # 中身が変わっていなくても送ります。1回あたり90KB ほどですし、
        # 前回の送信に失敗していても次の回で勝手に直るためです。
        #
        # 【置き場所】
        # XSERVER_DATA_PATH は、docs/ を置いた公開ディレクトリの下の data/ です。
        # 例）公開ディレクトリが /var/www/weather なら /var/www/weather/data
        #
        # 【設定】
        #   Settings → Secrets and variables → Actions
        #     Variables : XSERVER_HOST / XSERVER_USER / XSERVER_DATA_PATH
        #                 XSERVER_KNOWN_HOSTS（`ssh-keyscan -H <ホスト>` の出力）
        #     Secrets   : XSERVER_SSH_KEY（秘密鍵の中身をそのまま）
        #   変数と秘密を分けているのは、ログで隠されない値は変数にしたほうが
        #   うまくいかないときに原因を追いやすいためです。
        if: inputs.dry-run != true
        env:
          XS_HOST:  ${{ vars.XSERVER_HOST }}
          XS_USER:  ${{ vars.XSERVER_USER }}
          XS_PATH:  ${{ vars.XSERVER_DATA_PATH }}
          XS_HOSTKEY: ${{ vars.XSERVER_KNOWN_HOSTS }}
          XS_KEY:   ${{ secrets.XSERVER_SSH_KEY }}
        run: |
          set -euo pipefail

          # まだ設定していないうちは、ここだけ飛ばします。
          # 4つとも空のときに限ります。half設定は事故なので下で止めます。
          if [ -z "$XS_HOST" ] && [ -z "$XS_USER" ] && [ -z "$XS_PATH" ] && [ -z "$XS_KEY" ]; then
            echo "::notice::Xserver の設定がまだありません。送信を飛ばしました。"
            exit 0
          fi

          missing=""
          if [ -z "$XS_HOST" ]; then missing="$missing XSERVER_HOST(変数)"; fi
          if [ -z "$XS_USER" ]; then missing="$missing XSERVER_USER(変数)"; fi
          if [ -z "$XS_PATH" ]; then missing="$missing XSERVER_DATA_PATH(変数)"; fi
          if [ -z "$XS_KEY"  ]; then missing="$missing XSERVER_SSH_KEY(秘密)"; fi
          if [ -n "$missing" ]; then
            echo "::error::設定が足りません：$missing"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$XS_KEY" > ~/.ssh/id_xserver
          chmod 600 ~/.ssh/id_xserver

          # 相手が本物か確かめます。登録した鍵があればそれを使います。
          # 無いときはその場で取りにいきますが、初回だけ相手を信用することに
          # なるので、ssh-keyscan の結果を変数に入れておくほうが安全です。
          if [ -n "$XS_HOSTKEY" ]; then
            printf '%s\n' "$XS_HOSTKEY" > ~/.ssh/known_hosts
          else
            echo "::warning::XSERVER_KNOWN_HOSTS が未設定です。" \
                 "ssh-keyscan -H でホスト鍵を取り、変数に入れるとなりすましを防げます。"
            ssh-keyscan -H "$XS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          OPTS="-i $HOME/.ssh/id_xserver -o IdentitiesOnly=yes"
          OPTS="$OPTS -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          WHERE="$XS_USER@$XS_HOST"

          ssh $OPTS "$WHERE" "mkdir -p '$XS_PATH'"

          # いったん別名で置いてから、同じ場所で名前を付け替えます。
          # 直接上書きすると、書いている途中のファイルをブラウザが読んで
          # 「壊れたJSON」になることがあるためです。付け替えは一瞬で終わります。
          for f in latest.json history.json accuracy.json; do
            scp $OPTS "docs/data/$f" "$WHERE:$XS_PATH/.$f.tmp"
            ssh $OPTS "$WHERE" \
              "chmod 644 '$XS_PATH/.$f.tmp' && mv -f '$XS_PATH/.$f.tmp' '$XS_PATH/$f'"
            echo "送りました： $f"
          done
