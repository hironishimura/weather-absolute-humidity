name: iPhone・iPad・Mac アプリの確認

# 手元の Linux では Swift を動かせないので、ここ（macOS）で確かめています。
#   1. WeatherCore（計算と読み取り）の単体テスト
#   2. iPhone / iPad / Mac それぞれのビルド

on:
  push:
    branches: [main, apple]
    paths:
      - 'apple/**'
      - '.github/workflows/apple-build.yml'
  pull_request:
    paths:
      - 'apple/**'
  workflow_dispatch:

concurrency:
  group: apple-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: WeatherCore のテスト
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode の場所を出す
        run: xcodebuild -version && swift --version
      - name: テスト
        run: |
          set -o pipefail
          swift test --package-path apple/WeatherCore 2>&1 \
            | grep -Ev "^Test Case .* passed|^Test Suite .* passed|' started\.$" 

  app:
    name: アプリのビルド
    runs-on: macos-15
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone
            destination: 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          - name: iPad
            destination: 'platform=iOS Simulator,name=iPad (10th generation),OS=latest'
          - name: Mac
            destination: 'platform=macOS'
    steps:
      - uses: actions/checkout@v4
      - name: 使えるシミュレータを出す
        run: xcrun simctl list devices available | head -40
      - name: プロジェクトの中身を出す
        run: xcodebuild -project apple/WeatherAH.xcodeproj -list
      - name: ${{ matrix.name }} 向けにビルド
        run: |
          set -o pipefail
          set -o pipefail
          xcodebuild build \
            -project apple/WeatherAH.xcodeproj \
            -scheme WeatherAH \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | xcbeautify --quiet || \
          xcodebuild build \
            -project apple/WeatherAH.xcodeproj \
            -scheme WeatherAH \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: 中身が入っているか確かめる
        # ソースが1本も入っていなくてもビルドは通ってしまうので、
        # 出来上がったアプリの実行ファイルがあることを見ておきます。
        run: |
          APP=$(find /tmp/dd/Build/Products -maxdepth 2 -name '*.app' | head -1)
          echo "できたもの: $APP"
          if [ -z "$APP" ]; then echo "アプリが見つかりません"; exit 1; fi
          BIN=$(find "$APP" -type f -perm +111 ! -name '*.dylib' | head -1)
          SIZE=$(stat -f%z "$BIN")
          echo "実行ファイル: $BIN（$SIZE バイト）"
          if [ "$SIZE" -lt 100000 ]; then echo "小さすぎます"; exit 1; fi
