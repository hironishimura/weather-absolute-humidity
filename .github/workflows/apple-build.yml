name: iPhone・iPad・Mac アプリの確認

# 手元の Linux では Swift を動かせないので、ここ（macOS）で確かめています。
#   1. WeatherCore（計算と読み取り）の単体テスト
#   2. iPhone / iPad / Mac それぞれのビルド

on:
  push:
    branches: [main, apple]
    paths:
      - 'apple/**'
      - '.github/workflows/apple-build.yml'
  pull_request:
    paths:
      - 'apple/**'
  workflow_dispatch:

concurrency:
  group: apple-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: WeatherCore のテスト
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode の場所を出す
        run: xcodebuild -version && swift --version
      - name: テスト
        run: swift test --package-path apple/WeatherCore

  app:
    name: アプリのビルド
    runs-on: macos-15
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone
            destination: 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          - name: iPad
            destination: 'platform=iOS Simulator,name=iPad (10th generation),OS=latest'
          - name: Mac
            destination: 'platform=macOS'
    steps:
      - uses: actions/checkout@v4
      - name: 使えるシミュレータを出す
        run: xcrun simctl list devices available | head -40
      - name: プロジェクトの中身を出す
        run: xcodebuild -project apple/WeatherAH.xcodeproj -list
      - name: ${{ matrix.name }} 向けにビルド
        run: |
          set -o pipefail
          xcodebuild build \
            -project apple/WeatherAH.xcodeproj \
            -scheme WeatherAH \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | xcbeautify --quiet || \
          xcodebuild build \
            -project apple/WeatherAH.xcodeproj \
            -scheme WeatherAH \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
