name: ページの作りを調べる

on:
  push:
    branches: [probe]
  workflow_dispatch:
    inputs:
      url:
        description: '調べるURL'
        type: string
        default: ''
      links:
        description: 'リンクを探すページのURL'
        type: string
        default: ''
      keyword:
        description: '手がかり'
        type: string
        default: '宇都宮'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ウェザーニュース（script の中身）
        continue-on-error: true
        run: python3 scripts/probe.py --scripts "https://weathernews.jp/onebox/tenki/tochigi/09201/" --keyword "湿度"

      - name: ウェザーニュース（ページ内のURL）
        continue-on-error: true
        run: python3 scripts/probe.py --urls "https://weathernews.jp/onebox/tenki/tochigi/09201/"
