name: ページの作りを調べる

on:
  push:
    branches: [probe]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright を入れる
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: 描画後に何があるか見る
        run: python3 scripts/collect_browser.py --dump --source weathernews
