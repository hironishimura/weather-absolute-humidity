name: ページの作りを調べる

on:
  push:
    branches: [probe]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Yahoo の週間表
        continue-on-error: true
        run: python3 scripts/probe.py --weekly "https://weather.yahoo.co.jp/weather/jp/9/4110/9201.html"
      - name: Playwright を入れる
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: WN の描画後（週間まわり）
        continue-on-error: true
        run: python3 scripts/collect_browser.py --dump --source weathernews
