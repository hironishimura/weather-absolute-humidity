name: ページの作りを調べる

on:
  push:
    branches: [probe]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 読み取りの確認
        run: python3 scripts/test_collect.py
      - name: 実際に取り込んでみる
        run: python3 scripts/collect.py --dry-run
