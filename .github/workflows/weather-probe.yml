name: ページの作りを調べる

on:
  push:
    branches: [probe]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 読み取りの確認
        run: python3 scripts/test_collect.py
      - name: ページから取り込む
        run: python3 scripts/collect.py
      - name: Playwright を入れる
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: ブラウザで取り込む
        run: python3 scripts/collect_browser.py
      - name: 結果を見る
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('docs/data/latest.json', encoding='utf-8'))
          for k, v in d['sources'].items():
              if not v.get('ok'):
                  print('%-12s 失敗 %s' % (k, v.get('error'))); continue
              print('%-12s %s' % (k, v.get('strategy')))
              print('   時系列 %d点  週間 %d日  降水確率 %d区間'
                    % (len(v.get('hourly') or []), len(v.get('weekly') or []), len(v.get('pops') or [])))
              for r in (v.get('pops') or [])[:6]:
                  print('     %s' % r)
          PY
